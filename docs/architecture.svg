<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 516" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6.5,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6.5,3 L0,6 Z" fill="#34d399"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6.5,3 L0,6 Z" fill="#60a5fa"/></marker>
  </defs>
  <rect x="0" y="0" width="1120" height="516" fill="#ffffff"/>
  <text x="40" y="46" fill="#0f172a" font-size="23" font-weight="600">MedVision — Explainable Skin-Lesion Classifier</text>
  <text x="40" y="69" fill="#64748b" font-size="13">DermaMNIST · timm backbone · Grad-CAM explanations · ONNX-optimized, latency-benchmarked inference</text>

  <!-- TRAINING panel -->
  <rect x="28" y="86" width="1064" height="96" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="108" fill="#2563eb" font-size="11" font-weight="700" letter-spacing="1.2">TRAINING · OFFLINE</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="46"  y="120" width="150" height="50" rx="9" fill="#eff6ff" stroke="#60a5fa"/><text x="121" y="141" fill="#1e40af">DermaMNIST</text><text x="121" y="158" fill="#2563eb" font-size="10.5">7 skin-lesion classes</text>
    <rect x="228" y="120" width="128" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="292" y="141" fill="#334155">Augment +</text><text x="292" y="158" fill="#334155">normalize</text>
    <rect x="388" y="118" width="166" height="54" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/><text x="471" y="140" fill="#6d28d9" font-weight="600">timm backbone</text><text x="471" y="157" fill="#7c3aed" font-size="10.5">ConvNeXt / ViT</text>
    <rect x="586" y="120" width="150" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="661" y="141" fill="#334155">Train</text><text x="661" y="158" fill="#64748b" font-size="10.5">weighted loss · AUROC</text>
    <rect x="768" y="118" width="150" height="54" rx="9" fill="#eff6ff" stroke="#3b82f6"/><text x="843" y="140" fill="#1e40af" font-weight="600">Checkpoint</text><text x="843" y="157" fill="#2563eb" font-size="10.5">best val AUROC</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M196,145 L226,145"/><path d="M356,145 L386,145"/><path d="M554,145 L584,145"/><path d="M736,145 L766,145"/>
  </g>

  <!-- OPTIMIZE panel -->
  <rect x="28" y="200" width="1064" height="132" rx="14" fill="#f6fbf8" stroke="#dcf2e7"/>
  <text x="46" y="223" fill="#059669" font-size="11" font-weight="700" letter-spacing="1.2">OPTIMIZE</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="768" y="236" width="150" height="42" rx="8" fill="#ecfdf5" stroke="#34d399"/><text x="843" y="262" fill="#047857">Export → ONNX</text>
    <rect x="768" y="290" width="150" height="42" rx="8" fill="#ecfdf5" stroke="#34d399"/><text x="843" y="316" fill="#047857">INT8 quantize</text>
    <rect x="586" y="263" width="150" height="42" rx="8" fill="#ffffff" stroke="#34d399"/><text x="661" y="281" fill="#047857">Benchmark</text><text x="661" y="296" fill="#059669" font-size="10">latency · size</text>
  </g>
  <g stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#ag)">
    <path d="M843,172 L843,234"/><path d="M843,278 L843,288"/><path d="M766,311 L738,300"/>
  </g>

  <line x1="40" y1="356" x2="1080" y2="356" stroke="#e2e8f0"/>

  <!-- SERVING panel -->
  <rect x="28" y="372" width="1064" height="124" rx="14" fill="#fafaff" stroke="#ececfb"/>
  <text x="46" y="395" fill="#7c3aed" font-size="11" font-weight="700" letter-spacing="1.2">SERVING · FastAPI /app</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="46"  y="408" width="150" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="121" y="429" fill="#334155">Upload image</text><text x="121" y="446" fill="#64748b" font-size="10.5">dermatoscopy</text>
    <rect x="228" y="408" width="140" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="298" y="429" fill="#334155">Preprocess</text><text x="298" y="446" fill="#64748b" font-size="10.5">resize · normalize</text>
    <rect x="400" y="406" width="158" height="54" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/><text x="479" y="428" fill="#6d28d9" font-weight="600">Model</text><text x="479" y="445" fill="#7c3aed" font-size="10.5">forward + Grad-CAM</text>
    <rect x="620" y="404" width="200" height="30" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="720" y="424" fill="#1e40af" font-size="12">Prediction + top-k probs</text>
    <rect x="620" y="442" width="200" height="30" rx="8" fill="#ecfdf5" stroke="#34d399"/><text x="720" y="462" fill="#047857" font-size="12">Grad-CAM heatmap overlay</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M196,433 L226,433"/><path d="M368,433 L398,433"/><path d="M558,428 L618,420"/><path d="M558,438 L618,455"/>
  </g>
  <path d="M843,172 C843,330 479,320 479,404" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#ab)"/>
  <text x="560" y="392" fill="#94a3b8" font-size="10.5">trained weights</text>
</svg>
